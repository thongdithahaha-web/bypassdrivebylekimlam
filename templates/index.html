<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tải file Google Drive</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #4285f4; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Tải file từ Google Drive</h1>
    <form action="/download" method="post">
        <input type="text" name="url" placeholder="Dán link Google Drive..." required>
        <button type="submit">Tải xuống</button>
    </form>
</body>
</html>
